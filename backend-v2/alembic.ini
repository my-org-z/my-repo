[alembic]
# Path to the database migration scripts
script_location = alembic

# Database URL (will be overridden by environment variable)
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/hintai_v2

# Additional settings for async
sqlalchemy.url.async = True

# Version path separator
version_path_separator = os

# Path to the models (for autogenerate)
# models = app.models

# Output encoding
output_encoding = utf-8

# Logging
# logging_level = INFO
# logging_file = alembic.log

# Use batch mode for PostgreSQL
batch_mode = True

[post_write_hooks]
# Hooks to run after migrations

[alembic.environment]
# Environment-specific settings

[alembic.version_table]
# Name of the version table
version_table = alembic_version

[alembic.context]
# Additional context variables
