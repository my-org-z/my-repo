[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hintai-backend-v2"
version = "2.0.0"
description = "Backend API for HintAI V2 - AI-Powered Educational Platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "HintAI Team", email = "contact@hintai.com"}
]
keywords = ["education", "ai", "fastapi", "learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "sqlalchemy>=2.0.25",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.28.0",
    "pgvector>=0.2.5",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "requests>=2.31.0",
    "httpx>=0.26.0",
    "celery>=5.3.6",
    "redis>=5.0.1",
    "opencv-python-headless>=4.8.1.78",
    "pytesseract>=0.3.10",
    "Pillow>=10.1.0",
    "numpy>=1.26.4",
    "pdf2image>=1.16.3",
    "mistralai>=1.0.0",
    "sentence-transformers>=2.2.2",
    "python-magic>=0.4.27",
    "alembic>=1.13.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "black>=23.12.1",
    "isort>=5.13.2",
    "flake8>=6.1.0",
    "mypy>=1.8.0",
    "python-decouple>=3.8",
]

[project.scripts]
start = "backend_v2.app.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend_v2*"]
